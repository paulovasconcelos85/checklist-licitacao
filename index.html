<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist de Aceitabilidade de Proposta</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #fff;
      max-width: 1100px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.2);
      padding: 20px 30px;
    }

    h1 {
      text-align: center;
      color: #3f2b96;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .section {
      margin-top: 25px;
    }

    .section-title {
      font-weight: bold;
      font-size: 17px;
      color: #3f2b96;
      margin-bottom: 10px;
      border-left: 5px solid #3f2b96;
      padding-left: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 20px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8f8f8;
      padding: 6px 10px;
      border-radius: 6px;
      transition: 0.2s;
    }

    .checklist-item:hover {
      background: #eef1ff;
    }

    .checklist-label {
      flex: 1;
      font-size: 14px;
      color: #333;
      transition: 0.3s;
    }

    .checkbox-group {
      display: flex;
      gap: 10px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
      accent-color: #3f2b96;
    }

    .observations {
      margin-top: 15px;
    }

    .observations label {
      display: block;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    .observations textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      min-height: 70px;
      resize: vertical;
    }

    .btn-save {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      background: linear-gradient(135deg, #3f2b96 0%, #a8c0ff 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-save:hover {
      transform: scale(1.02);
      box-shadow: 0 5px 15px rgba(63,43,150,0.4);
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }

    @media print {
      body { background: white; }
      .btn-save { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Checklist de Aceitabilidade de Proposta</h1>

    <div class="input-group">
      <label>Certame:</label>
      <input type="text" id="certame">
    </div>
    <div class="input-group">
      <label>Licitante:</label>
      <input type="text" id="licitante">
    </div>

    <div class="section">
      <div class="section-title">Aceitabilidade de Proposta</div>
      <div class="grid" id="aceitabilidade">
        <!-- Checklists gerados aqui -->
      </div>

      <div class="observations">
        <label>Observações gerais da Aceitabilidade:</label>
        <textarea id="obs_aceitabilidade"></textarea>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Habilitação</div>
      <div class="grid" id="habilitacao">
        <div class="checklist-item"><span class="checklist-label">Jurídica</span>
          <div class="checkbox-group">
            <label class="checkbox-wrapper"><input type="checkbox" onchange="setStatus(this)"> Atende</label>
            <label class="checkbox-wrapper"><input type="checkbox" onchange="setStatus(this)"> Não atende</label>
          </div>
        </div>
        <div class="checklist-item"><span class="checklist-label">Regularidade Fiscal e Trabalhista</span>
          <div class="checkbox-group">
            <label class="checkbox-wrapper"><input type="checkbox" onchange="setStatus(this)"> Atende</label>
            <label class="checkbox-wrapper"><input type="checkbox" onchange="setStatus(this)"> Não atende</label>
          </div>
        </div>
        <div class="checklist-item"><span class="checklist-label">Econômico-financeira</span>
          <div class="checkbox-group">
            <label class="checkbox-wrapper"><input type="checkbox" onchange="setStatus(this)"> Atende</label>
            <label class="checkbox-wrapper"><input type="checkbox" onchange="setStatus(this)"> Não atende</label>
          </div>
        </div>
        <div class="checklist-item"><span class="checklist-label">Qualificação Técnica</span>
          <div class="checkbox-group">
            <label class="checkbox-wrapper"><input type="checkbox" onchange="setStatus(this)"> Atende</label>
            <label class="checkbox-wrapper"><input type="checkbox" onchange="setStatus(this)"> Não atende</label>
          </div>
        </div>
      </div>

      <div class="observations">
        <label>Observações gerais da Habilitação:</label>
        <textarea id="obs_habilitacao"></textarea>
      </div>
    </div>

    <button class="btn-save" onclick="salvarChecklist()">💾 Salvar Checklist</button>
  </div>

  <script>
    const aceitabilidadeCampos = [
      "CNPJ", "E-mail", "Telefone", "Endereço", "Data",
      "Representante", "Validade da proposta", "Descrição",
      "Quantidade", "Unidade", "Valor unitário", "Valor Total (R$)",
      "Valor total por extenso", "Catálogo", "Dados bancários"
    ];

    const grid = document.getElementById("aceitabilidade");

    aceitabilidadeCampos.forEach(campo => {
      const item = document.createElement("div");
      item.className = "checklist-item";
      item.innerHTML = `
        <span class="checklist-label">${campo}</span>
        <div class="checkbox-group">
          <label class="checkbox-wrapper"><input type="checkbox" onchange="setStatus(this)"> Atende</label>
          <label class="checkbox-wrapper"><input type="checkbox" onchange="setStatus(this)"> ${
            campo === "Catálogo" ? "Não exigido" : "Não atende"
          }</label>
        </div>`;
      grid.appendChild(item);
    });

    function setStatus(checkbox) {
      const item = checkbox.closest(".checklist-item");
      const label = item.querySelector(".checklist-label");
      const all = item.querySelectorAll("input[type='checkbox']");
      all.forEach(cb => { if (cb !== checkbox) cb.checked = false; });
      if (checkbox.checked) {
        if (checkbox.nextSibling.textContent.includes("Atende")) {
          label.style.color = "#007bff";
          label.style.fontWeight = "normal";
        } else if (checkbox.nextSibling.textContent.includes("Não atende")) {
          label.style.color = "red";
          label.style.fontWeight = "bold";
        } else {
          label.style.color = "#444";
          label.style.fontWeight = "normal";
        }
      } else {
        label.style.color = "#333";
        label.style.fontWeight = "normal";
      }
    }

    function salvarChecklist() {
      const certame = document.getElementById("certame").value;
      const licitante = document.getElementById("licitante").value;
      const obsAceit = document.getElementById("obs_aceitabilidade").value;
      const obsHabil = document.getElementById("obs_habilitacao").value;
      const dados = { certame, licitante, aceitabilidade: {}, habilitacao: {}, obsAceit, obsHabil };

      document.querySelectorAll("#aceitabilidade .checklist-item").forEach(item => {
        const nome = item.querySelector(".checklist-label").textContent;
        const marcado = Array.from(item.querySelectorAll("input[type=checkbox]"))
          .find(cb => cb.checked)?.nextSibling.textContent.trim() || "";
        dados.aceitabilidade[nome] = marcado;
      });

      document.querySelectorAll("#habilitacao .checklist-item").forEach(item => {
        const nome = item.querySelector(".checklist-label").textContent;
        const marcado = Array.from(item.querySelectorAll("input[type=checkbox]"))
          .find(cb => cb.checked)?.nextSibling.textContent.trim() || "";
        dados.habilitacao[nome] = marcado;
      });

      const blob = new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `checklist_${certame.replace(/[^a-z0-9]/gi, "_")}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      alert("✅ Checklist salvo com sucesso!");
    }
  </script>
</body>
</html>
